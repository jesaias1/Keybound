<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@GAME_TITLE@@</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e5d4c0; color: #34263f; font: 16px system-ui, sans-serif; display: grid; place-content: center; gap: 16px; }
    #stage { position: relative; width: min(96vw, calc(177.7778vh - 177.7778px)); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: #e5d4c0; box-shadow: 0 10px 34px #34263f30; }
    canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #welcome { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #fff4e3; }
    h1 { font-size: clamp(28px, 5vw, 72px); margin: 0 0 14px; font-weight: 900; }
    p { line-height: 1.5; }
    button { color: inherit; font: inherit; font-weight: 700; border: 2px solid #b69b77; background: #f4d599; border-radius: 12px; padding: 12px 26px; cursor: pointer; }
    button:hover { background: #ffe8b6; }
    button:focus-visible { outline: 3px solid #796193; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { max-width: 650px; white-space: pre-wrap; }
    progress { width: min(400px, 65vw); accent-color: #796193; margin: 14px auto 0; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px; padding: 0 4px; }
    footer button { padding: 8px 18px; }
    #stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; display: grid; place-content: center; background: #241e39; }
    #stage:fullscreen canvas { width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); }
    [hidden] { display: none !important; }
    #online-lobby { position: absolute; inset: 0; background: #fff4e3f5; display: grid; place-content: center; text-align: center; padding: 24px; }
    #online-lobby h2 { font-size: 36px; margin: 0 0 12px; }
    #online-setup { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    #join-code { font: inherit; width: 150px; text-transform: uppercase; border: 2px solid #b69b77; border-radius: 12px; padding: 12px; }
    #room-code { display: block; font: bold 48px monospace; letter-spacing: 6px; margin: 14px; user-select: all; }
    #online-status { max-width: 650px; min-height: 48px; }
    #online-close { margin: 20px auto 0; background: #e5d4c0; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080" tabindex="0" aria-label="@@GAME_TITLE@@ game"></canvas>
    <section id="welcome">
      <h1>@@GAME_TITLE@@</h1>
      <p>Tiny typists. Giant keyboard. Beautiful mistakes.</p>
      <button id="play" type="button">PLAY</button>
      <p id="status" role="status">WASD / arrows to move · Space to jump · Controllers welcome</p>
      <progress id="progress" hidden></progress>
      <noscript>JavaScript is required to run this game.</noscript>
    </section>
  </main>
  <section id="online-lobby" hidden aria-label="Online lobby">
    <h2>TYPE TOGETHER ONLINE</h2>
    <div id="online-setup">
      <button id="online-host" type="button">HOST A ROOM</button>
      <input id="join-code" maxlength="6" aria-label="Room code" placeholder="Room code" autocomplete="off">
      <button id="online-join" type="button">JOIN ROOM</button>
    </div>
    <strong id="room-code"></strong><p id="online-status" role="status"></p>
    <button id="online-start" hidden type="button">START TOGETHER</button>
    <button id="online-close" type="button">LEAVE / CLOSE</button>
  </section>
  <footer>
    <span>2–4 typists · Local co-op or online rooms · Keep the host's tab open</span>
    <button id="fullscreen" type="button">FULLSCREEN</button>
  </footer>
  <script src="$GODOT_URL"></script>
  <script src="network-config.js"></script>
  <script src="convex.js"></script>
  <script src="online.js"></script>
  <script>
    const config = $GODOT_CONFIG;
    const canvas = document.getElementById('canvas');
    const play = document.getElementById('play');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const engine = new Engine(config);
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.getElementById('stage').requestFullscreen();
        canvas.focus();
      } catch (error) { status.textContent = error.message; }
    });
    play.addEventListener('click', async () => {
      play.disabled = true;
      const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
      if (missing.length) {
        status.textContent = 'This browser is missing: ' + missing.join(', ') + '. Try an updated Chrome, Edge or Firefox.';
        play.disabled = false;
        return;
      }
      status.textContent = 'Loading the keyboard…';
      progress.hidden = false;
      try {
        await engine.startGame({ canvas, onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
        }});
        document.getElementById('welcome').hidden = true;
        canvas.focus();
      } catch (error) {
        console.error(error);
        status.textContent = 'The game could not start. ' + error.message;
        progress.hidden = true;
        play.disabled = false;
      }
    });
  </script>
</body>
</html>
